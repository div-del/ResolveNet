<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Complaint Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00d4ff;
      --cyan-glow: rgba(0,212,255,0.4);
      --purple: #7b4fff;
      --card-bg: rgba(10,12,20,0.85);
      --input-bg: rgba(255,255,255,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #050710;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(123,79,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,212,255,0.15) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
    }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      pointer-events: none; z-index: 0;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .orb-1 { width:400px;height:400px;background:rgba(123,79,255,0.12);top:-100px;left:-100px; }
    .orb-2 { width:300px;height:300px;background:rgba(0,212,255,0.1);bottom:-80px;right:-80px;animation-delay:-4s; }
    .orb-3 { width:200px;height:200px;background:rgba(0,212,255,0.08);top:50%;left:10%;animation-delay:-2s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(30px,20px) scale(1.1); }
    }
    .login-wrapper {
      position:relative; z-index:1; width:100%; max-width:440px; padding:16px;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(32px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 20px;
      padding: 44px 40px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 0 0 1px rgba(0,212,255,0.08), 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position:absolute; top:0; left:10%; right:10%; height:1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity:0.7;
    }
    .corner-tl, .corner-br { position:absolute; width:24px; height:24px; pointer-events:none; }
    .corner-tl { top:14px;left:14px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);border-radius:4px 0 0 0;opacity:0.6; }
    .corner-br { bottom:14px;right:14px;border-bottom:2px solid var(--purple);border-right:2px solid var(--purple);border-radius:0 0 4px 0;opacity:0.6; }
    .logo-area { text-align:center; margin-bottom:24px; }
    .logo-ring {
      width:68px; height:68px; margin:0 auto 14px;
      position:relative; display:flex; align-items:center; justify-content:center;
    }
    .logo-ring::before {
      content:''; position:absolute; inset:0; border-radius:50%;
      border:1.5px solid transparent;
      background: linear-gradient(135deg,var(--cyan),var(--purple)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out; mask-composite: exclude;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .logo-inner {
      width:52px; height:52px; border-radius:50%;
      background: linear-gradient(135deg,rgba(0,212,255,0.15),rgba(123,79,255,0.2));
      border:1px solid rgba(0,212,255,0.2);
      display:flex; align-items:center; justify-content:center;
    }
    .logo-inner svg { width:26px;height:26px;fill:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan-glow)); }
    .system-label {
      font-family:'Orbitron',monospace; font-size:10px; font-weight:600;
      letter-spacing:3px; color:var(--cyan); opacity:0.7;
      text-transform:uppercase; margin-bottom:6px;
    }
    .login-title { font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:#fff;letter-spacing:1px; }
    .login-subtitle { font-size:14px;color:rgba(255,255,255,0.35);margin-top:5px;font-weight:300;letter-spacing:0.5px; }
    .status-bar { display:flex;align-items:center;gap:6px;margin-bottom:24px;justify-content:center; }
    .status-dot {
      width:6px;height:6px;border-radius:50%;background:var(--cyan);
      box-shadow:0 0 6px var(--cyan);animation:pulse 2s ease-in-out infinite;
    }
    .status-dot:nth-child(2){animation-delay:0.3s;background:var(--purple);box-shadow:0 0 6px var(--purple);}
    .status-dot:nth-child(3){animation-delay:0.6s;}
    @keyframes pulse {
      0%,100%{opacity:1;transform:scale(1);}
      50%{opacity:0.4;transform:scale(0.7);}
    }
    .status-text { font-size:10px;letter-spacing:2px;color:rgba(0,212,255,0.5);text-transform:uppercase;margin-left:4px; }
    .error-box {
      background:rgba(220,50,50,0.08); border:1px solid rgba(220,50,50,0.25);
      border-radius:8px; color:#ff6b6b; font-size:13px;
      padding:10px 14px; margin-bottom:16px; display:none;
    }
    .field-group { margin-bottom:18px; }
    .field-label {
      display:flex; align-items:center; gap:6px;
      font-size:11px; font-weight:600; letter-spacing:1.5px;
      text-transform:uppercase; color:rgba(0,212,255,0.7); margin-bottom:8px;
    }
    .field-label svg { width:13px;height:13px;fill:var(--cyan);opacity:0.7; }
    .field-input {
      width:100%; height:48px;
      background:var(--input-bg); border:1px solid rgba(0,212,255,0.15);
      border-radius:10px; color:#fff;
      font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:500;
      padding:0 16px; outline:none;
      transition:border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .field-input::placeholder { color:rgba(255,255,255,0.18);font-weight:300; }
    .field-input:focus {
      border-color:var(--cyan); background:rgba(0,212,255,0.06);
      box-shadow:0 0 0 3px rgba(0,212,255,0.1),inset 0 0 12px rgba(0,212,255,0.04);
    }
    .field-input:hover:not(:focus) { border-color:rgba(0,212,255,0.3); }
    .meta-row { display:flex;justify-content:space-between;align-items:center;margin-bottom:22px; }
    .remember-label {
      display:flex;align-items:center;gap:8px;cursor:pointer;
      font-size:13px;color:rgba(255,255,255,0.4);font-weight:400;user-select:none;
    }
    .remember-label input[type="checkbox"] {
      appearance:none;width:16px;height:16px;
      border:1px solid rgba(0,212,255,0.3);border-radius:4px;
      background:transparent;cursor:pointer;position:relative;transition:all 0.2s;
    }
    .remember-label input[type="checkbox"]:checked {
      background:linear-gradient(135deg,var(--cyan),var(--purple));border-color:var(--cyan);
    }
    .remember-label input[type="checkbox"]:checked::after {
      content:'✓';position:absolute;top:-1px;left:2px;color:#000;font-size:11px;font-weight:700;
    }
    .forgot-link { font-size:13px;color:var(--cyan);text-decoration:none;opacity:0.7;transition:opacity 0.2s;font-weight:500; }
    .forgot-link:hover { opacity:1; }
    .btn-login {
      width:100%;height:50px;border:none;border-radius:10px;
      background:linear-gradient(135deg,#0099cc,var(--cyan) 40%,var(--purple));
      color:#fff;font-family:'Orbitron',monospace;font-size:12px;
      font-weight:700;letter-spacing:3px;text-transform:uppercase;
      cursor:pointer;position:relative;overflow:hidden;
      transition:transform 0.15s,box-shadow 0.25s;
      box-shadow:0 4px 24px rgba(0,212,255,0.25);
    }
    .btn-login:hover { transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,212,255,0.4); }
    .btn-login:active { transform:translateY(0) scale(0.99); }
    .divider {
      display:flex;align-items:center;gap:12px;margin:20px 0;
      color:rgba(255,255,255,0.15);font-size:11px;letter-spacing:2px;text-transform:uppercase;
    }
    .divider::before,.divider::after {
      content:'';flex:1;height:1px;
      background:linear-gradient(90deg,transparent,rgba(0,212,255,0.15),transparent);
    }
    .register-row { text-align:center;font-size:13px;color:rgba(255,255,255,0.3); }
    .register-row a { color:var(--cyan);text-decoration:none;font-weight:600;letter-spacing:0.5px;transition:opacity 0.2s; }
    .register-row a:hover { opacity:0.75; }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="corner-tl"></div>
      <div class="corner-br"></div>

      <!-- Header -->
      <div class="logo-area">
        <div class="logo-ring">
          <div class="logo-inner">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4a3 3 0 110 6 3 3 0 010-6zm0 14c-2.67 0-5.03-1.37-6.42-3.44C7.01 14.17 9.42 13 12 13s4.99 1.17 6.42 2.56C16.03 17.63 14.67 19 12 19z"/></svg>
          </div>
        </div>
        <div class="system-label">Secure Portal</div>
        <h1 class="login-title">System Access</h1>
        <p class="login-subtitle">Complaint Management System</p>
      </div>

      <!-- Status dots -->
      <div class="status-bar">
        <div class="status-dot"></div>
        <div class="status-dot"></div>
        <div class="status-dot"></div>
        <span class="status-text">System Online</span>
      </div>

      <!-- Error -->
      <div class="error-box" id="errorMsg">⚠ &nbsp;Invalid credentials. Access denied.</div>

      <!-- Form -->
      <form action="LoginServlet" method="post" id="loginForm">

        <!-- EMAIL FIELD -->
        <!-- name="email" is how your Java Servlet reads this value: request.getParameter("email") -->
        <div class="field-group">
          <div class="field-label">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            Email Address
          </div>
          <input type="email" class="field-input" id="email" name="email" placeholder="user@domain.com" required autocomplete="email">
        </div>

        <!-- PASSWORD FIELD -->
        <!-- name="password" → Java reads as: request.getParameter("password") -->
        <div class="field-group">
          <div class="field-label">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            Password
          </div>
          <input type="password" class="field-input" id="password" name="password" placeholder="••••••••••••" required minlength="6" autocomplete="current-password">
        </div>

        <!-- Remember + Forgot -->
        <div class="meta-row">
          <label class="remember-label">
            <input type="checkbox" name="rememberMe" id="rememberMe">
            Remember me
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit button — sends form to LoginServlet -->
        <button type="submit" class="btn-login">Authenticate</button>

      </form>

      <div class="divider">or</div>

      <div class="register-row">
        No account? &nbsp;<a href="register.html">Register here →</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    form.addEventListener('submit', function(e) {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        e.preventDefault();
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';
    });
    document.getElementById('email').addEventListener('input', () => errorMsg.style.display = 'none');
    document.getElementById('password').addEventListener('input', () => errorMsg.style.display = 'none');
  </script>
</body>
</html>
